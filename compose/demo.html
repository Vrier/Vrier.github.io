<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COMPOSE demo</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<style>
/* ===========================================================================
   COMPOSE: homepage mini-demo
   The derive view of compose.tstephen.com (v1.4.0, parchment theme), cut down
   to one derivation at a time. The engine is the app's own (engine.js and
   lcformat.js beside this file, copied unchanged from Vrier/compose).
   ========================================================================= */
:root {
  --on-accent: oklch(0.99 0.01 80);
  --bg:        oklch(0.961 0.013 78);
  --bg-grain:  oklch(0.945 0.016 76);
  --panel:     oklch(0.985 0.008 82);
  --panel-2:   oklch(0.972 0.011 80);
  --ink:       oklch(0.285 0.022 52);
  --ink-soft:  oklch(0.42 0.02 55);
  --muted:     oklch(0.545 0.018 58);
  --faint:     oklch(0.69 0.014 62);
  --faint-text:oklch(0.535 0.014 62);
  --line:      oklch(0.875 0.016 72);
  --line-soft: oklch(0.915 0.012 74);
  --accent:    oklch(0.558 0.13 44);
  --accent-ink:oklch(0.46 0.13 42);
  --accent-soft:oklch(0.93 0.05 56);
  --good:      oklch(0.55 0.1 150);
  --good-soft: oklch(0.93 0.05 152);
  --bad:       oklch(0.55 0.16 26);
  --bad-soft:  oklch(0.94 0.05 30);
  --select:    oklch(0.62 0.11 250);
  --select-soft:oklch(0.93 0.045 250);
  --shadow:    0 1px 2px oklch(0.4 0.03 60 / 0.08), 0 8px 24px oklch(0.4 0.03 60 / 0.07);
  --shadow-sm: 0 1px 2px oklch(0.4 0.03 60 / 0.1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Spectral', Georgia, serif; font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- shell ------------------------------------------------------------- */
.demo {
  height: 100%; display: flex; flex-direction: column;
  background:
    radial-gradient(circle at 18% 12%, var(--bg-grain) 0, transparent 40%),
    radial-gradient(circle at 86% 84%, var(--bg-grain) 0, transparent 44%),
    var(--bg);
  overflow: hidden;
}

/* ---- header: eyebrow, sentence, tools (the app's stage header) --------- */
.d-head { flex-shrink: 0; padding: 14px 18px 10px; }
.d-eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.d-eyebrow .mark { color: var(--accent); font-size: 14px; letter-spacing: 0; text-transform: none; }
.d-eyebrow .spacer { flex: 1; }
.d-eyebrow .count { letter-spacing: 0.04em; text-transform: none; font-size: 12px; }
.d-title-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.d-title { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0; flex: 1 1 auto; line-height: 1.25; }
.d-tools { display: flex; gap: 6px; }
.btn-ghost {
  background: var(--panel-2); color: var(--ink-soft); border: 1px solid var(--line);
  border-radius: 8px; font-size: 12.5px; padding: 4px 10px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s; white-space: nowrap;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--ink); }
.btn-ghost.on { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
.d-target {
  margin-top: 8px; font-size: 14px; color: var(--ink-soft);
  background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 7px;
  padding: 3px 10px; width: fit-content; max-width: 100%;
}
.d-target .lead { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }

/* ---- canvas + tree (the app's tree styles) ----------------------------- */
.demo-canvas {
  flex: 1; min-height: 0; position: relative; overflow: auto;
  display: grid; place-content: safe center; padding: 6px;
  border-top: 1px solid var(--line-soft);
}
.demo-sizer { position: relative; }
.demo-zoom { position: absolute; top: 0; left: 0; transform-origin: top left; }
.tree-inner { position: absolute; top: 0; left: 0; }
.tree-svg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.tree-svg line { stroke: var(--line); stroke-width: 1.5; }
.tree-node {
  position: absolute; transform: translate(-50%, 0); z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center;
}
.node-box {
  position: relative; min-width: 46px; padding: 6px 12px; border-radius: 9px;
  border: 1.5px solid var(--line); background: var(--panel); box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; align-items: center; line-height: 1.3;
  transition: border-color .16s, box-shadow .16s, background .16s;
}
button.node-box { cursor: pointer; font: inherit; }
.node-box .node-label { font-size: 13px; color: var(--muted); font-style: italic; }
.node-box .node-span { font-size: 10px; color: var(--faint-text); font-style: italic; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-box.selected .node-label, .node-box.available .node-label,
.node-box.selected .node-span, .node-box.available .node-span { color: var(--ink-soft); }
.node-box .node-word { font-size: 16px; font-weight: 500; }
.node-leaf .node-box { background: var(--panel-2); }
button.node-box:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.node-box.available { border-color: var(--accent); border-style: dashed; }
.node-box.available::after {
  content: ''; position: absolute; inset: -4px; border-radius: 12px;
  border: 1px solid var(--accent); opacity: 0.25; pointer-events: none;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.12; } 50% { opacity: 0.4; } }
.node-box.selected { border-color: var(--select); border-style: solid; background: var(--select-soft); box-shadow: 0 0 0 3px var(--select-soft); }
.node-box.done { border-color: var(--good); }
.node-rule-tag {
  position: absolute; top: -10px; right: -8px; font-size: 9.5px; font-weight: 700; font-style: normal;
  letter-spacing: 0.04em; background: var(--good); color: white;
  padding: 2px 6px; border-radius: 6px; box-shadow: var(--shadow-sm);
}
.node-meaning {
  font-size: 14px; padding: 2px 9px; border-radius: 7px;
  background: color-mix(in oklab, var(--good-soft) 60%, var(--bg));
  color: var(--ink); max-width: 240px; line-height: 1.35;
}
.node-meaning.pending { background: var(--panel-2); color: var(--muted); font-style: italic; font-size: 12.5px; white-space: nowrap; }
.node-type-badge { font-size: 11px; color: var(--accent-ink); margin-top: -2px; padding: 0 4px; border-radius: 4px; background: var(--bg); white-space: nowrap; }
.compose-line .node-type-badge { background: none; }

/* ---- dock --------------------------------------------------------------- */
.demo-dock {
  flex-shrink: 0; border-top: 1px solid var(--line); background: var(--panel);
  padding: 10px 18px 12px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 -8px 24px oklch(0.5 0.02 60 / 0.04);
}
.dock-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dock-hint { color: var(--muted); font-size: 13.5px; font-style: italic; line-height: 1.4; }
.dock-hint.bad { color: color-mix(in oklab, var(--bad) 78%, var(--ink)); font-style: normal; }
.dock-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* rule choice: compact chips; the description sits in the hint line */
.rule-chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 9px;
  padding: 5px 11px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.rule-chip:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.rule-chip .rc-abbr { font-size: 9.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; letter-spacing: 0.04em; }
.rule-chip .rc-mark { color: var(--bad); font-weight: 700; }
.rule-chip.rejected { border-color: var(--bad); background: var(--bad-soft); cursor: default; animation: shake .32s ease; }
.rule-chip.rejected:hover { transform: none; box-shadow: none; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.compose-line {
  font-size: 16px; padding: 6px 12px; border-radius: 9px;
  background: var(--panel-2); border: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.compose-line .lead { font-size: 12px; color: var(--muted); font-style: italic; }
.pm-op { color: var(--accent); padding: 0 2px; }

.entry-row { display: flex; gap: 8px; align-items: stretch; }
.entry {
  flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
  border: 1.5px solid var(--line); border-radius: 9px; background: var(--bg);
  padding: 0 12px; transition: border-color .15s, box-shadow .15s;
}
.entry:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.entry.err { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.entry input {
  flex: 1; border: 0; outline: 0; background: transparent; padding: 8px 0; min-width: 0;
  font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; color: var(--ink);
}
.entry .live { font-size: 15px; color: var(--ink-soft); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.75; }
.btn-primary {
  border: 0; cursor: pointer; font-size: 13.5px; font-weight: 600; padding: 0 16px; border-radius: 9px;
  background: var(--accent); color: var(--on-accent); white-space: nowrap;
}
.btn-primary:hover { filter: brightness(1.06); box-shadow: var(--shadow); }
.palette { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.palette .sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
.sym-key {
  min-width: 24px; height: 25px; padding: 0 5px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; color: var(--ink-soft);
}
.sym-key:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.grow { flex: 1; }

.feedback { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; padding: 8px 12px; border-radius: 9px; line-height: 1.45; }
.feedback.good { background: var(--good-soft); color: color-mix(in oklab, var(--good) 75%, var(--ink)); }
.feedback.bad { background: var(--bad-soft); color: color-mix(in oklab, var(--bad) 78%, var(--ink)); }
.feedback .fi { font-size: 14px; line-height: 1.4; flex: 0 0 auto; }
.feedback .note { display: block; color: var(--ink-soft); margin-top: 2px; }

/* ---- footer: sentence pills + link to the app -------------------------- */
.demo-nav {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 8px 18px; border-top: 1px solid var(--line);
  background: color-mix(in oklab, var(--panel) 90%, transparent);
}
.nav-pills { display: flex; align-items: center; gap: 6px; }
.nav-pill {
  width: 24px; height: 24px; border-radius: 50%; padding: 0;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--muted);
  font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600;
  display: grid; place-items: center; cursor: pointer; transition: all .15s;
}
.nav-pill:hover { border-color: var(--accent); color: var(--accent-ink); }
.nav-pill.active { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.nav-pill.solved { border-color: var(--good); color: var(--good); }
.nav-pill.solved.active { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.cta-link {
  font-size: 12.5px; color: var(--ink-soft); text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
}
.cta-link:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

/* ---- λ-notation (the engine's HTML output) ------------------------------ */
.lx-var, .lx-bv { font-style: italic; font-family: 'Spectral', serif; }
.lx-const, .lx-binder { font-style: normal; }
.lx-dot { color: var(--faint); margin: 0 1px 0 0; }
.lx-op { padding: 0 0.32em; color: var(--ink-soft); }
.lx-neg { padding: 0 0.04em 0 0; }
.lx-paren, .lx-comma { color: var(--faint); }
.lx-colon { color: var(--accent-ink); padding: 0 0.34em; font-weight: 600; }
.lx-sub { font-size: 0.65em; vertical-align: sub; font-style: normal; line-height: 0; }
.ty-atom { font-style: italic; }
.ty-var { font-style: italic; color: var(--accent-ink); }
.ty-ang, .ty-comma, .ty-prod { color: var(--faint); }

.fade-in { animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.demo-canvas::-webkit-scrollbar { height: 8px; width: 8px; }
.demo-canvas::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

@media (max-width: 480px) {
  .d-head { padding: 12px 14px 8px; }
  .d-title { font-size: 18px; flex-basis: 100%; }
  .demo-dock, .demo-nav { padding-left: 14px; padding-right: 14px; }
  .palette { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .node-box.available::after { opacity: 0.3; }
}
</style>
<script src="engine.js"></script>
<script src="lcformat.js"></script>
</head>
<body>
<main class="demo">
  <header class="d-head">
    <div class="d-eyebrow">
      <span class="mark" aria-hidden="true">λ</span><span>COMPOSE · Demo</span>
      <span class="spacer"></span><span class="count" id="d-count"></span>
    </div>
    <div class="d-title-row">
      <h1 class="d-title" id="d-title">“Frodo runs”</h1>
      <div class="d-tools">
        <button type="button" class="btn-ghost" id="d-tc" aria-pressed="false">Truth conditions</button>
        <button type="button" class="btn-ghost" id="d-reset">↺ Reset</button>
      </div>
    </div>
    <div class="d-target" id="d-target" hidden></div>
  </header>
  <div class="demo-canvas" id="demo-canvas">
    <div class="demo-sizer" id="demo-sizer"><div class="demo-zoom" id="demo-zoom"></div></div>
  </div>
  <div class="demo-dock" id="demo-dock" aria-live="polite"></div>
  <nav class="demo-nav" aria-label="Demo sentences">
    <div class="nav-pills" id="demo-pills"></div>
    <span class="grow"></span>
    <a class="cta-link" href="https://compose.tstephen.com" target="_blank" rel="noopener">Open COMPOSE <span aria-hidden="true">↗</span></a>
  </nav>
</main>

<script>
/* ===========================================================================
   Demo driver: bottom-up composition by Function Application, Predicate
   Modification and Non-branching Node, with β-reduction entry, as in the
   app's derive view. Vanilla JS on window.LC / window.LCFormat.
   ========================================================================= */
(function () {
  'use strict';
  var E = window.LC, F = window.LCFormat;

  /* ---- content ------------------------------------------------------------ */
  var DOMAIN = {
    multiLetterNames: true,
    constants: { e: 'f s g n a b l m o w bi st pi tm el sr mr' },
    variables: { e: 'x y z', et: 'X Y Z P Q R F G H', t: 'p q' }
  };
  var LEXICON = [
    { words: ['Frodo'], denotation: 'f' },
    { words: ['Sam'], denotation: 's' },
    { words: ['Pippin'], denotation: 'pi' },
    { words: ['runs', 'run'], denotation: 'Lx.run(x)' },
    { words: ['trusts', 'trust'], denotation: 'Ly.Lx.trust(x,y)' },
    { words: ['drinks', 'drink'], denotation: 'Lx.drink(x)' },
    { words: ['every', 'Every'], denotation: 'LX.LY.Ax[X(x) -> Y(x)]' },
    { words: ['hobbit'], denotation: 'Lx.hobbit(x)' },
    { words: ['mischievous'], denotation: 'Lx.mischievous(x)' },
    { words: ['is', 'are'], denotation: 'LX.X' },
    { words: ['a', 'an'], denotation: 'LX.X' }
  ];
  var EXERCISES = [
    { sentence: 'Frodo runs',
      tree: '[.S [.DP Frodo ] [.VP runs ] ]',
      rules: ['fa', 'nn'],
      note: 'A subject of type e combines with an intransitive verb of type ⟨e,t⟩ by Function Application, giving a proposition of type t.' },
    { sentence: 'Frodo trusts Sam',
      tree: '[.S [.DP Frodo ] [.VP [.V trusts ] [.DP Sam ] ] ]',
      rules: ['fa', 'nn'],
      note: 'A transitive verb of type ⟨e,⟨e,t⟩⟩ takes its object first, then its subject: two applications.' },
    { sentence: 'Every hobbit drinks',
      tree: '[.S [.DP [.D every ] [.NP hobbit ] ] [.VP drinks ] ]',
      rules: ['fa', 'nn'],
      note: '“Every” is a determiner of type ⟨⟨e,t⟩,⟨⟨e,t⟩,t⟩⟩. It takes its restrictor noun, then the predicate.' },
    { sentence: 'Pippin is a mischievous hobbit',
      tree: '[.S [.DP Pippin ] [.VP [.V is ] [.NP [.D a ] [.NP [.AP mischievous ] [.NP hobbit ] ] ] ] ]',
      rules: ['fa', 'pm', 'nn'],
      note: 'The adjective and the noun, both of type ⟨e,t⟩, combine by Predicate Modification: λx.[F(x) ∧ G(x)].' }
  ];
  var SET = F.parseJSON({ compose: 1, domain: DOMAIN, lexicon: LEXICON });

  /* ---- state -------------------------------------------------------------- */
  var idx = 0, root = null, solution = null;
  var meanings = {}, solved = {}, solvedFlag = {};
  var sel = null, chosen = null, val = '', fb = null, rejected = {}, hint = null;
  var showTC = false;

  /* ---- helpers ------------------------------------------------------------ */
  function isLeaf(n) { return !n.children || n.children.length === 0; }
  function getMeaning(n) {
    if (meanings[n.id]) return meanings[n.id];
    if (isLeaf(n)) return solution[n.id] || null;
    return null;
  }
  function isAvailable(n) {
    return !isLeaf(n) && !getMeaning(n) && n.children.every(function (c) { return getMeaning(c); });
  }
  function allDone() {
    var rm = getMeaning(root);
    return !!(rm && E.typeToStr(rm.type) === 't');
  }
  function rulesFor(node) {
    var allowed = EXERCISES[idx].rules;
    return F.candidateRules(node.children.map(getMeaning)).filter(function (r) { return allowed.indexOf(r.key) >= 0; });
  }
  function spanOf(n) {
    if (isLeaf(n)) return n.word;
    return n.children.map(spanOf).join(' ');
  }
  function typeHTML(t) { return E.typeToHTML(typeof t === 'string' ? E.parseType(t) : t); }
  function nota(ast) { return '<span class="lx">' + E.toHTML(ast) + '</span>'; }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function label(n) { return '⟨' + (n.label || '•') + '⟩'; }

  /* ---- tree layout (the app's algorithm, tighter gaps for a small box) ---- */
  var layout;
  function layoutTree(rt) {
    var LEAF_GAP = 136, LEVEL_GAP = 104, PADY = 16;
    var leafCursor = 0, maxDepth = 0, pos = {};
    (function assign(node, depth) {
      maxDepth = Math.max(maxDepth, depth);
      if (isLeaf(node)) { pos[node.id] = { gx: leafCursor++, depth: depth }; return pos[node.id].gx; }
      var xs = node.children.map(function (c) { return assign(c, depth + 1); });
      pos[node.id] = { gx: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, depth: depth };
      return pos[node.id].gx;
    })(rt, 0);
    var nodes = [], edges = [];
    (function collect(node) {
      var p = pos[node.id], px = p.gx * LEAF_GAP, py = PADY + p.depth * LEVEL_GAP;
      nodes.push({ node: node, px: px, py: py });
      (node.children || []).forEach(function (c) {
        var cp = pos[c.id];
        edges.push({ x1: px, y1: py + 20, x2: cp.gx * LEAF_GAP, y2: PADY + cp.depth * LEVEL_GAP - 2 });
        collect(c);
      });
    })(rt);
    return { nodes: nodes, edges: edges, span: Math.max(0, leafCursor - 1) * LEAF_GAP,
      depthY: PADY + maxDepth * LEVEL_GAP, width: 0, height: 0 };
  }

  /* ---- DOM ---------------------------------------------------------------- */
  var $canvas, $sizer, $zoom, $inner, $dock, $pills, nodeEls = {};

  function loadExercise(i) {
    idx = i;
    root = F.parseTree(EXERCISES[i].tree);
    solution = F.solveTree(root, SET);
    meanings = solved[i] || (solved[i] = {});
    sel = null; chosen = null; val = ''; fb = null; rejected = {}; hint = null;
    layout = layoutTree(root);
    buildCanvas();
    renderHead();
    renderDock();
    renderNav();
    fitZoom();
  }

  function renderHead() {
    document.getElementById('d-title').textContent = '“' + EXERCISES[idx].sentence + '”';
    var n = Object.keys(solvedFlag).length;
    document.getElementById('d-count').textContent = n + '/' + EXERCISES.length + ' solved';
    var tc = document.getElementById('d-tc'), tgt = document.getElementById('d-target');
    tc.classList.toggle('on', showTC);
    tc.setAttribute('aria-pressed', showTC ? 'true' : 'false');
    tgt.hidden = !showTC;
    if (showTC) tgt.innerHTML = '<span class="lead">Target</span>' + nota(solution[root.id].term);
  }

  function buildCanvas() {
    $zoom.innerHTML = '';
    $inner = el('div', 'tree-inner');
    $zoom.appendChild($inner);
    var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'tree-svg');
    svg.setAttribute('width', layout.span + 1); svg.setAttribute('height', layout.depthY + 1);
    svg.style.overflow = 'visible';
    svg.setAttribute('aria-hidden', 'true');
    layout.edges.forEach(function (e) {
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', e.x1); ln.setAttribute('y1', e.y1);
      ln.setAttribute('x2', e.x2); ln.setAttribute('y2', e.y2);
      svg.appendChild(ln);
    });
    $inner.appendChild(svg);
    nodeEls = {};
    layout.nodes.forEach(function (entry) {
      var node = entry.node, leaf = isLeaf(node);
      var wrap = el('div', 'tree-node' + (leaf ? ' node-leaf' : ''));
      wrap.style.left = entry.px + 'px';
      wrap.style.top = entry.py + 'px';
      var box;
      if (leaf) {
        box = el('div', 'node-box', '<span class="node-word">' + E.toHTML(E.parse(E.asciiToUnicode(node.word))) + '</span>');
      } else {
        box = el('button', 'node-box');
        box.type = 'button';
        box.addEventListener('click', function () { pickNode(node); });
      }
      wrap.appendChild(box);
      var below = el('div', null);
      below.style.display = 'contents';
      wrap.appendChild(below);
      $inner.appendChild(wrap);
      nodeEls[node.id] = { wrap: wrap, box: box, below: below, leaf: leaf };
    });
    refreshNodes();
  }

  function refreshNodes() {
    layout.nodes.forEach(function (entry) {
      var node = entry.node, ref = nodeEls[node.id], m = getMeaning(node);
      if (ref.leaf) {
        ref.below.innerHTML = '<span class="node-meaning">' + E.toHTML(m.term) + '</span>' +
          '<span class="node-type-badge">' + typeHTML(m.type) + '</span>';
        return;
      }
      var avail = isAvailable(node), selected = !!(sel && sel.node.id === node.id);
      var cls = ['node-box'];
      if (avail) cls.push('available');
      if (selected) cls.push('selected');
      if (m) cls.push('done');
      ref.box.className = cls.join(' ');
      ref.box.innerHTML = '<span class="node-label">' + (node.label || '•') + '</span>' +
        (m ? '' : '<span class="node-span">' + spanOf(node) + '</span>') +
        (m && m.rule ? '<span class="node-rule-tag">' + m.rule + '</span>' : '');
      var state = m ? 'resolved by ' + m.rule : avail ? 'ready to compose' : 'awaiting children';
      ref.box.setAttribute('aria-label', (node.label || 'node') + ' (' + spanOf(node) + '), ' + state);
      ref.below.innerHTML = m
        ? '<span class="node-meaning fade-in">' + E.toHTML(m.term) + '</span><span class="node-type-badge">' + typeHTML(m.type) + '</span>'
        : '<span class="node-meaning pending">' + (avail ? 'ready to compose' : 'awaiting children') + '</span>';
    });
    measure();
  }

  /* the tree's real extent, chips included, so nothing is clipped at the edges */
  function measure() {
    var M = 14, minX = Infinity, maxX = -Infinity, maxY = 0;
    layout.nodes.forEach(function (entry) {
      var w = nodeEls[entry.node.id].wrap, half = w.offsetWidth / 2;
      minX = Math.min(minX, entry.px - half);
      maxX = Math.max(maxX, entry.px + half);
      maxY = Math.max(maxY, entry.py + w.offsetHeight);
    });
    layout.width = Math.ceil(maxX - minX + 2 * M);
    layout.height = Math.ceil(maxY + M);
    $inner.style.left = (M - minX) + 'px';
    $zoom.style.width = layout.width + 'px';
    $zoom.style.height = layout.height + 'px';
    fitZoom();
  }

  function fitZoom() {
    if (!layout || !layout.width) return;
    var cw = $canvas.clientWidth - 12, ch = $canvas.clientHeight - 12;
    if (cw <= 0 || ch <= 0) return;
    var z = Math.min(cw / layout.width, ch / layout.height, 1.15);
    z = Math.max(0.56, z);
    $zoom.style.transform = 'scale(' + z + ')';
    $sizer.style.width = Math.ceil(layout.width * z) + 'px';
    $sizer.style.height = Math.ceil(layout.height * z) + 'px';
  }

  /* ---- interaction -------------------------------------------------------- */
  function pickNode(node) {
    var m = getMeaning(node);
    if (m) { sel = { node: node, mode: 'view', m: m }; chosen = null; fb = null; rejected = {}; renderAll(); return; }
    if (!isAvailable(node)) { fb = { kind: 'info', msg: 'Work bottom-up. A node lights up once its children have meanings.' }; renderDock(); return; }
    sel = { node: node, mode: 'compose' }; chosen = null; val = ''; fb = null; rejected = {}; hint = null;
    renderAll();
    var first = $dock.querySelector('.rule-chip');
    if (first) first.focus();
  }

  function pickRule(entry) {
    if (!entry.ok) { rejected[entry.key] = entry.reason; hint = { bad: true, text: entry.reason }; renderDock(); return; }
    var node = sel.node, result = entry.result, isPM = entry.key === 'pm';
    if (!isPM && E.isNormal(result.term) && (!entry.raw || E.alphaEqual(result.term, entry.raw))) {
      resolveNode(node, { term: E.prettifyVars(result.term), type: result.type, rule: entry.abbr });
      sel = null; chosen = null; rejected = {};
      fb = { kind: 'good', msg: entry.name + ' applied. Nothing to β-reduce.' };
      renderAll(); return;
    }
    chosen = { rule: entry, result: result, raw: entry.raw, isPM: isPM,
               sisters: isPM ? node.children.map(getMeaning) : null };
    val = ''; fb = null;
    renderDock(); focusEntry();
  }

  function resolveNode(node, resolved) {
    meanings[node.id] = resolved;
    if (allDone()) solvedFlag[idx] = true;
    refreshNodes(); renderHead();
  }

  function check() {
    if (!chosen) return;
    var parsed = E.tryParse(val);
    if (!parsed.ok) { fb = { kind: 'bad', msg: 'That expression could not be read. Check the brackets and operators.' }; renderDock(); focusEntry(); return; }
    var stuNorm = E.normalize(parsed.ast);
    if (E.equivACη(stuNorm, chosen.result.term)) {
      var name = chosen.rule.name, node = sel.node;
      resolveNode(node, { term: E.isNormal(parsed.ast) ? parsed.ast : stuNorm, type: chosen.result.type, rule: chosen.rule.abbr });
      sel = null; chosen = null; val = '';
      fb = { kind: 'good', msg: 'Correct. ' + label(node) + ' resolved by ' + name + '.' };
      renderAll(); return;
    }
    if (!E.isNormal(parsed.ast)) fb = { kind: 'bad', msg: 'Keep going: that still contains a β-redex. Reduce it fully.' };
    else if (chosen.isPM) fb = { kind: 'bad', msg: 'Not quite. Predicate Modification gives λx.[A(x) ∧ B(x)]: conjoin the two sisters under one variable.' };
    else fb = { kind: 'bad', msg: 'Not equivalent yet. Check which variable each argument replaces.' };
    renderDock(); focusEntry();
  }

  function reveal() { val = E.toStr(E.normalize(chosen.result.term)); renderDock(); focusEntry(); }

  function resetNode(node) {
    // a node's meaning feeds every ancestor, so clear those too
    (function clearUp(n) {
      delete meanings[n.id];
      var parent = layout.nodes.map(function (e) { return e.node; })
        .filter(function (p) { return (p.children || []).indexOf(n) >= 0; })[0];
      if (parent) clearUp(parent);
    })(node);
    delete solvedFlag[idx];
    sel = null; fb = null; chosen = null;
    renderAll(); renderHead();
  }

  function resetAll() {
    solved[idx] = meanings = {};
    delete solvedFlag[idx];
    sel = null; chosen = null; val = ''; fb = null; rejected = {}; hint = null;
    renderAll(); renderHead();
  }

  /* ---- β-reduction entry ---------------------------------------------------- */
  var entryInput = null, liveEl = null;
  var CTRL_MAP = { l: 'λ', a: '∀', e: '∃', n: '¬', m: '→', '7': '∧', '\\': '∨' };
  var PALETTE = [['λ', '∀', '∃'], ['∧', '∨', '¬', '→'], ['[', ']', '(', ')']];
  function focusEntry() {
    requestAnimationFrame(function () {
      if (entryInput) { entryInput.focus(); var p = entryInput.value.length; entryInput.setSelectionRange(p, p); }
    });
  }
  function insertSym(txt) {
    if (!entryInput) return;
    var s = entryInput.selectionStart != null ? entryInput.selectionStart : val.length;
    var e2 = entryInput.selectionEnd != null ? entryInput.selectionEnd : val.length;
    val = val.slice(0, s) + txt + val.slice(e2);
    entryInput.value = val; updateLive();
    requestAnimationFrame(function () { entryInput.focus(); entryInput.setSelectionRange(s + txt.length, s + txt.length); });
  }
  function updateLive() {
    if (!liveEl) return;
    var live = val ? E.asciiToUnicode(val) : '';
    if (live && live !== val) {
      liveEl.style.display = '';
      try { liveEl.innerHTML = E.toHTML(E.parse(live)); } catch (e) { liveEl.textContent = live; }
    } else liveEl.style.display = 'none';
  }

  /* ---- dock ------------------------------------------------------------------ */
  function feedbackEl(f) {
    var icon = f.kind === 'good' ? '✓' : f.kind === 'bad' ? '✕' : '›';
    return el('div', 'feedback ' + (f.kind === 'info' ? '' : f.kind) + ' fade-in',
      '<span class="fi" aria-hidden="true">' + icon + '</span><div>' + f.msg + '</div>');
  }

  function renderDock() {
    entryInput = null; liveEl = null;
    $dock.innerHTML = '';

    if (!sel && allDone()) {
      var last = idx === EXERCISES.length - 1;
      var done = el('div', 'feedback good fade-in',
        '<span class="fi" aria-hidden="true">✓</span><div>Derivation complete. The root meaning is computed.' +
        '<span class="note">' + EXERCISES[idx].note + '</span></div>');
      $dock.appendChild(done);
      if (!last) {
        var row = el('div', 'dock-row');
        var next = el('button', 'btn-ghost', 'Next sentence →');
        next.type = 'button';
        next.addEventListener('click', function () { loadExercise(idx + 1); });
        row.appendChild(next);
        $dock.appendChild(row);
      }
      return;
    }

    if (!sel) {
      var avail = layout.nodes.some(function (e) { return isAvailable(e.node); });
      $dock.appendChild(el('div', 'dock-hint', avail ? 'Select a highlighted node to compute its meaning.'
        : 'Work bottom-up. A node lights up once its children have meanings.'));
      if (fb) $dock.appendChild(feedbackEl(fb));
      return;
    }

    if (sel.mode === 'view') {
      $dock.appendChild(el('div', 'dock-label', label(sel.node) + ' · resolved by ' + sel.m.rule));
      $dock.appendChild(el('div', 'compose-line', nota(sel.m.term) + ' <span class="node-type-badge">' + typeHTML(sel.m.type) + '</span>'));
      var vrow = el('div', 'dock-row');
      var rst = el('button', 'btn-ghost', '↺ Reset this node'); rst.type = 'button';
      rst.addEventListener('click', function () { resetNode(sel.node); });
      var cls = el('button', 'btn-ghost', 'Close'); cls.type = 'button';
      cls.addEventListener('click', function () { sel = null; fb = null; renderAll(); });
      vrow.appendChild(rst); vrow.appendChild(cls);
      $dock.appendChild(vrow);
      return;
    }

    if (!chosen) {
      $dock.appendChild(el('div', 'dock-label', 'Choose a composition rule for ' + label(sel.node)));
      var rr = el('div', 'dock-row');
      rr.setAttribute('role', 'group');
      rr.setAttribute('aria-label', 'Composition rules');
      rulesFor(sel.node).forEach(function (entry) {
        var rej = rejected[entry.key];
        var chip = el('button', 'rule-chip' + (rej ? ' rejected' : ''),
          (rej ? '<span class="rc-mark" aria-hidden="true">✕</span>' : '') + entry.name + ' <span class="rc-abbr">' + entry.abbr + '</span>');
        chip.type = 'button';
        if (rej) { chip.setAttribute('aria-disabled', 'true'); chip.title = rej; }
        else chip.title = entry.desc;
        chip.addEventListener('click', function () { if (!rej) pickRule(entry); });
        var show = function () { if (!hint || !hint.bad) setHint(rej ? { bad: true, text: rej } : { text: entry.desc }); };
        chip.addEventListener('mouseenter', show);
        chip.addEventListener('focus', show);
        rr.appendChild(chip);
      });
      var cancel = el('button', 'btn-ghost', 'Cancel'); cancel.type = 'button';
      cancel.addEventListener('click', function () { sel = null; hint = null; renderAll(); });
      rr.appendChild(cancel);
      $dock.appendChild(rr);
      var h = el('div', 'dock-hint' + (hint && hint.bad ? ' bad' : ''),
        hint ? hint.text : 'Pick the rule you think applies. A wrong choice is marked in red with the reason.');
      h.id = 'rule-hint';
      $dock.appendChild(h);
      return;
    }

    $dock.appendChild(el('div', 'dock-label',
      chosen.rule.name + ': ' + (chosen.isPM ? 'write the modified predicate' : 'apply <span style="text-transform:none">β</span>-reduction')));
    $dock.appendChild(el('div', 'compose-line', chosen.isPM
      ? '<span class="lead">conjoin the sisters</span>' + nota(chosen.sisters[0].term) + ' <span class="pm-op">⊓</span> ' + nota(chosen.sisters[1].term)
      : '<span class="lead">reduce</span>' + nota(chosen.raw || chosen.result.term)));
    var erow = el('div', 'entry-row');
    var entry = el('div', 'entry' + (fb && fb.kind === 'bad' ? ' err' : ''));
    entryInput = document.createElement('input');
    entryInput.spellcheck = false; entryInput.autocomplete = 'off'; entryInput.setAttribute('autocapitalize', 'off');
    entryInput.setAttribute('aria-label', chosen.isPM ? 'The modified predicate' : 'The β-reduced result');
    entryInput.placeholder = chosen.isPM ? 'λx.[ … ]' : 'Type the β-reduced result';
    entryInput.value = val;
    entryInput.addEventListener('input', function () { val = entryInput.value; updateLive(); });
    entryInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); check(); return; }
      if (ev.key === 'Escape') { chosen = null; fb = null; renderAll(); return; }
      if ((ev.ctrlKey || ev.metaKey) && !ev.altKey) {
        var sym = CTRL_MAP[ev.key.toLowerCase()];
        if (sym) { ev.preventDefault(); insertSym(sym); }
      }
    });
    liveEl = el('span', 'live');
    entry.appendChild(entryInput); entry.appendChild(liveEl);
    var checkBtn = el('button', 'btn-primary', 'Check'); checkBtn.type = 'button';
    checkBtn.addEventListener('click', check);
    erow.appendChild(entry); erow.appendChild(checkBtn);
    $dock.appendChild(erow);
    updateLive();

    var tools = el('div', 'dock-row');
    var pal = el('div', 'palette');
    PALETTE.forEach(function (grp, gi) {
      if (gi > 0) pal.appendChild(el('span', 'sep'));
      grp.forEach(function (g) {
        var k = el('button', 'sym-key', g); k.type = 'button'; k.setAttribute('aria-label', 'Insert ' + g);
        k.addEventListener('mousedown', function (e) { e.preventDefault(); insertSym(g); });
        k.addEventListener('click', function (e) { if (e.detail === 0) insertSym(g); });
        pal.appendChild(k);
      });
    });
    tools.appendChild(pal);
    tools.appendChild(el('span', 'grow'));
    var rev = el('button', 'btn-ghost', 'Reveal'); rev.type = 'button';
    rev.addEventListener('click', reveal);
    var back = el('button', 'btn-ghost', 'Back'); back.type = 'button';
    back.addEventListener('click', function () { chosen = null; fb = null; renderAll(); });
    tools.appendChild(rev); tools.appendChild(back);
    $dock.appendChild(tools);
    if (fb) $dock.appendChild(feedbackEl(fb));
  }

  function setHint(h) {
    hint = h;
    var node = document.getElementById('rule-hint');
    if (node) { node.textContent = h.text; node.className = 'dock-hint' + (h.bad ? ' bad' : ''); }
  }

  /* ---- footer ---------------------------------------------------------------- */
  function renderNav() {
    $pills.innerHTML = '';
    EXERCISES.forEach(function (ex, i) {
      var p = el('button', 'nav-pill' + (i === idx ? ' active' : '') + (solvedFlag[i] ? ' solved' : ''), String(i + 1));
      p.type = 'button';
      p.title = ex.sentence;
      p.setAttribute('aria-label', 'Sentence ' + (i + 1) + ': ' + ex.sentence + (solvedFlag[i] ? ', solved' : ''));
      if (i === idx) p.setAttribute('aria-current', 'true');
      p.addEventListener('click', function () { loadExercise(i); });
      $pills.appendChild(p);
    });
  }

  function renderAll() { refreshNodes(); renderDock(); renderNav(); }

  /* ---- boot ------------------------------------------------------------------- */
  function boot() {
    $canvas = document.getElementById('demo-canvas');
    $sizer = document.getElementById('demo-sizer');
    $zoom = document.getElementById('demo-zoom');
    $dock = document.getElementById('demo-dock');
    $pills = document.getElementById('demo-pills');
    document.getElementById('d-tc').addEventListener('click', function () { showTC = !showTC; renderHead(); });
    document.getElementById('d-reset').addEventListener('click', resetAll);
    loadExercise(0);
    new ResizeObserver(fitZoom).observe($canvas);
    window.addEventListener('resize', fitZoom);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (layout) measure(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
