<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found: Thomas Stephen</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Newsreader:opsz,wght@6..72,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: oklch(0.986 0.004 95);
    --ink: oklch(0.245 0.012 260);
    --ink-soft: oklch(0.44 0.012 260);
    --rule: oklch(0.885 0.008 260);
    --rule-strong: oklch(0.8 0.01 260);
    --accent: oklch(0.55 0.15 33);
    --accent-deep: oklch(0.46 0.14 33);
    --sans: "Space Grotesk", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  html,body{margin:0;}
  body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:var(--serif);font-size:1.1rem;line-height:1.6;-webkit-font-smoothing:antialiased;}
  main{padding:48px 24px;max-width:36rem;}
  .eyebrow{font-family:var(--mono);font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 18px;}
  h1{font-family:var(--sans);font-weight:600;font-size:clamp(2.2rem,6vw,3.2rem);letter-spacing:-0.03em;line-height:1;margin:0 0 18px;}
  p{margin:0 0 28px;color:var(--ink-soft);}
  nav{display:flex;flex-wrap:wrap;gap:10px;}
  nav a{font-family:var(--mono);font-size:0.8rem;letter-spacing:0.04em;color:var(--ink);text-decoration:none;
    border:1px solid var(--rule-strong);border-radius:999px;padding:8px 14px;transition:.16s;}
  nav a:hover{border-color:var(--accent);color:var(--accent-deep);}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · Thomas Stephen</p>
  <h1>Page not found</h1>
  <p>This page does not exist, or it has moved.</p>
  <nav>
    <a href="/">Homepage</a>
    <a href="/cv/">Curriculum Vitae</a>
  </nav>
</main>
</body>
</html>
