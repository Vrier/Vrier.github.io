# Curriculum vitae: the single source for www.tstephen.com/cv/ and
# files/Thomas-Stephen-CV.pdf.
#
# Edit this file, then rebuild both from the repo root:
#   python3 cv/build.py
# (needs Python 3 with PyYAML and Playwright; Claude sessions have both).
#
# In any text: *italic*, **bold**, ~subscript~ and [link text](url).
# Links that start with / point into this site, e.g. /files/TSPhD.pdf.
# Write date ranges with a hyphen (2017-2023); the build sets them as 2017–2023.

name: "Dr. Thomas Stephen"
position: "Fellow in Linguistics · School of Linguistic, Speech, and Communication Sciences, Trinity College Dublin"
updated: "November 2026"
contact:
  phone: "+44 7950 641625"
  email: "tmurrays@tcd.ie"
  website: "www.tstephen.com"
  orcid: "0009-0009-7721-8407"

# What the homepage (index.html) takes from this file on each rebuild.
homepage:
  summary_columns:          # the short CV in section 06, column by column
    - - education
      - {section: reviewing, group: "Research Assistant"}
    - - employment
      - {section: teaching, group: "Summer Schools", title: "Summer School Teaching"}
      - {section: reviewing, group: "Reviewer"}
  talks: presentations      # the Talks list in section 05
  teaching:                 # section 03, built from the teaching section below
    institutions:           # one row each; `name` is a group under Lecturing
      - name: "Trinity College Dublin"
        role: "Current"
        columns:            # `from`: groups to draw on; `level`: kept when the detail says it
          - {title: "Undergraduate", from: ["Trinity College Dublin"], level: "Undergraduate"}
          - {title: "Postgraduate", from: ["Trinity College Dublin"], level: "Masters"}
          - {title: "11-week in-depth", topics: "11 Week Special Topics Courses"}
      - name: "Queen Mary University of London"
        role: "Lecturer in Semantics"
        columns:
          - {title: "Undergraduate", from: ["Queen Mary University of London"], level: "Undergraduate"}
          - {title: "Postgraduate", from: ["Queen Mary University of London", "Convener"], level: "Masters"}
      - name: "University of Edinburgh"
        role: "Lecturer & Tutor"
        columns:
          - {title: "UG · as lecturer", from: ["University of Edinburgh"], level: "Undergraduate"}
          - {title: "UG · as tutor", from: ["Tutoring"], level: "Undergraduate"}
          - {title: "PG · as tutor", from: ["Tutoring"], level: "Masters"}
    features: "Summer Schools"   # one card per item (needs `tag` and `blurb`)
    supervision: "Supervision"   # its `theses` list

